services:
  backend:
    build: ./backend
    network_mode: host
    restart: unless-stopped
    environment:
      PRIVATE_DATA_DIR: /private
      SERIES_STORE_DIR: /home/mambauser/input-series
    volumes:
      - ./private:/private:ro
      - input-series:/home/mambauser/input-series

  frontend:
    build: ./frontend
    network_mode: host
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  input-series: