events { worker_connections 1024; }
http {
    # Refresh Docker service addresses after containers are recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream frontend_app {
        zone frontend_app 64k;
        server frontend:80 resolve;
    }
    upstream backend_app {
        zone backend_app 64k;
        server backend:8000 resolve;
    }
    server {
        client_max_body_size 5m;
        listen 80;
        server_name _;
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/sumo/ {
            proxy_pass http://host.docker.internal:8001;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /api/ {
            # Calibration runs synchronously and can take much longer than 60s.
            proxy_read_timeout 3600s;
            proxy_pass http://backend_app/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
